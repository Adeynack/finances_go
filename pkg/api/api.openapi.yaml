# yaml-language-server: $schema=https://raw.githubusercontent.com/OAI/OpenAPI-Specification/main/schemas/v3.1/schema.json
openapi: "3.1.0"
info:
  title: Finances API
  version: "1.0"
servers:
  - url: https://api.server.test/v1
paths:
  /health:
    get:
      responses:
        "200":
          description: OK
          content:
            "application/json":
              schema:
                type: object
                properties:
                  status:
                    $ref: "#/components/schemas/ServerHealthStatus"
                  reason:
                    type: string
                required:
                  - status

components:
  schemas:
    ServerHealthStatus:
      type: string
      enum:
        - healthy
        - unhealthy
